services:
  bot:
    build: .
    container_name: tg-funnel-bot
    env_file: .env
    environment:
      TZ: Europe/Moscow
    volumes:
      # Папка базы должна принадлежать uid 1000 — под ним работает процесс в контейнере:
      #   mkdir -p data && chown -R 1000:1000 data
      - ./data:/app/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
